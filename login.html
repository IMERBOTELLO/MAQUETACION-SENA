<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

</head>
<style>
    html, body {
        margin:0;
        font-family:Arial;
        padding:0;
        width:100%;
        height:100%;
    }

    .container{
        display:flex;
        width: 100%;
        height:100vh;
    }

    .sidebar{
        background-color:#1565c0;
        color:white;
        width:40%;
        display:flex;
        flex-direction:column;
        align-items:center;
        justify-content:center;
    }

    .login{
        background-color: rgba(51, 49, 49, 0.788);
        color:white;
        width:60%;
        display:flex;
        flex-direction:column;
        align-items:center;
        justify-content:center;
    }

    input{
        width: 80%;
        padding: 10px;
        margin: 10px 0;
        border: none;
        border-radius: 5px;
        background-color: rgba(51, 49, 49, 0.788);
        color: white;
    }
    
    input::placeholder{
        color: rgba(200, 200, 200, 0.5);
    }

    button{
        width: 80%;
        padding: 10px;
        margin: 10px 0;
        border: 1px solid #ffffff;
        border-radius: 5px;
        background-color: rgba(51, 49, 49, 0.788);
        color: white;
        font-size: 16px;
    }

    .checkbox-container{
        display:flex;
        accent-color: rgba(34, 32, 32, 0.788);
        align-items: center;
        justify-content:flex-start;
        width: 80%;
        color: rgba(32, 31, 31, 0.788);
        white-space: nowrap;
        margin: 10px auto;
    }
    .checkbox-container input[type=checkbox]{
        margin-right: 8px;
        margin: 0;
    }

    .checkbox-container label{
        margin: 0;
    }
</style>
<body>
    <div class="container">

        <!-- lado izquierdo -->

        <div class="sidebar">
            <h1>HOSPISOFT</h1>
            <p>Sistema de Gestión Hospitalaria</p>

            <div class="rol">Recepcionista</div>
            <div class="rol">Médico</div>
            <div class="rol">Laboraratorio</div>
            <div class="rol">Paciente</div>
            <div class="rol">Administrador</div>
            
        </div>

        <!-- FOOTER -->
    

        <!-- lado derecho -->

        <div class="login">
            <h2>Bienvenido</h2>
            <p>Ingresa tus credenciales para continuar</p>
                
            <input type="text" name="" id="Usuario" placeholder="Usuario">
            <input type="password" name="" id="contraseña" placeholder="Contraseña">
            
            <div class="checkbox-container"> <input type="checkbox" id="Recordar"> <label for="recordar">Recordar sesión</label></div>
            <button>Ingresar al sistema</button>

        </div>    
    </div>
     
</body>
</html>
