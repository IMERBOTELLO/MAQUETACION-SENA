<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pacientes Registrados</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/frontend/estilos/consulta_pacientes.css">
</head>

<body class="d-flex flex-column min-vh-100">


    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">
        <div class="container-fluid">
            <a class="navbar-brand titulo-navbar" href="/consulta_pacientes">Pacientes Registrados</a>
    
            <div class="collapse navbar-collapse" id="navbarSupportedContent">

                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="/index">Inicio</a>
                    </li>

                    <li class="nav-item">
                         <a class="nav-link active" aria-current="page" href="/registro_paciente">Registrar</a>
                    </li>
                </ul>
            </div>
         </div>
    </nav>


<main class="flex-grow-1">

  <h2 class="text-center text-primary mt-4 titulo">Pacientes Registrados</h2>
  <p class="text-center text-muted">Listado general de pacientes del sistema</p>


  <div class="container mt-4">
    <input type="text" id="buscador" class="form-control" placeholder="🔍 Buscar paciente...">
  </div>

  <div class="container mt-4">
    <div class="card shadow p-3 tabla-scroll">
      <table class="table table-dark table-hover align-middle">
        <thead class="table-primary">
          <tr>
            <th>Nombres</th>
            <th>Apellidos</th>
            <th>Numero de Documento</th>
            <th>Email</th>
            <th>Teléfono</th>
            <th>Fecha de registro</th>
            <th>Fecha de nacimiento </th>
            <th class="text-center">Acciones</th>
          </tr>
        </thead>
        
        <tbody id="tablapacientes">
          
        </tbody>
      </table>
    </div>
  </div>

  <div class="text-center mt-3">
    <a href="/registro_paciente" class="btn btn-success px-4">
      <i class="bi bi-person-plus"></i> Registrar nuevo paciente
    </a>
  </div>

</main>


<footer class="bg-primary text-white text-center py-3 w-100 mt-4">
  © 2026 Sistema de Gestión Hospitalaria | HOSPISOFT - SENA
</footer>

<script src="/frontend/js/seguridad.js"></script>
<script src="/frontend/JS/consulta_pacientes.js"></script>

</body>
</html>
