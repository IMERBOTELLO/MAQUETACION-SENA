<main class="flex-fill">
    
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-15">

            <div class="card shadow p-4">
                <h1 class="text-center text-success mb-4">Módulo Médico</h1>

                <div class="mb-3">
                    <label class="form-label">Buscar paciente (Numero de Documento)</label>
                    <div class="input-group">
                        <input type="text" class="form-control" placeholder="Ingrese número de documento">
                        <button class="btn btn-primary">Buscar</button>
                    </div>
                </div>

                <div class="mb-4">
                    <h5 class="text-secondary">Datos del Paciente</h5>
                    <div class="row">
                        <div class="col-md-4">
                            <input type="text" class="form-control mb-2" placeholder="Nombre" disabled>
                        </div>
                        <div class="col-md-4">
                            <input type="text" class="form-control mb-2" placeholder="Edad" disabled>
                        </div>
                        <div class="col-md-4">
                            <input type="text" class="form-control mb-2" placeholder="Teléfono" disabled>
                        </div>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Diagnóstico</label>
                    <textarea class="form-control" rows="3" placeholder="Ingrese diagnóstico"></textarea>
                </div>


                <div class="mb-3">
                    <label class="form-label">Observaciones</label>
                    <textarea class="form-control" rows="3" placeholder="Ingrese observaciones"></textarea>
                </div>

                <div class="mb-4">
                    <label class="form-label">Solicitar Exámenes</label>
                    <select class="form-select" multiple>
                        <option>Hemograma</option>
                        <option>Glucosa</option>
                        <option>Perfil Lipídico</option>
                        <option>Orina</option>
                        <option>COVID</option>
                        <option>Radiografia</option>
                    </select>
                </div>


                <div class="d-flex justify-content-between">
                    <button id="guardarBtn" class="btn btn-success">Guardar Diagnóstico</button>
                    <button id="ordenBtn" class="btn btn-warning">Generar Orden</button>
                </div>
                <div id="resultadoMedico" class="mt-4"></div>
            </div>

        </div>
    </div>
</div>
